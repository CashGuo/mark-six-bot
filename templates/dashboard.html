<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记账中台</title>
<style>
:root{
  --bd:#ccd2da; --bd2:#e3e7ec; --ink:#1b212c; --dim:#78818f;
  --bg:#f1f3f5; --head:#eaeef2; --card:#fafbfc;
  --red:#c0392b; --blue:#2b6cb0; --green:#2b8a5f; --grey:#aab2bd;
  /* 字号跟着窗口走：小窗口不至于把号码盘挤成一排黑点 */
  --fs-num:clamp(11px, 1.05vw, 14px);
  --fs-amt:clamp(11px, 1.05vw, 14px);
  --fs-zod:clamp(11px, 1vw, 13px);
  --fs-cell:clamp(11px, 1vw, 13px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:13.5px/1.45 "Microsoft YaHei","Segoe UI",Arial,sans-serif;padding:10px}
.wrap{max-width:1680px;margin:0 auto}

/* ---------- 顶部汇总条（与 GUI 顶栏同一行内容） ---------- */
.topbar{display:flex;align-items:center;gap:clamp(10px,1.4vw,20px);flex-wrap:wrap;
 background:#fff;border:1px solid var(--bd);border-radius:5px;padding:8px 12px;
 margin-bottom:10px}
.sumwrap{display:flex;align-items:baseline;gap:6px;flex:0 0 auto}
.sum-l{font-size:12px;color:var(--dim)}
.sum{font-size:clamp(19px,2vw,26px);font-weight:800;color:var(--red);
 font-variant-numeric:tabular-nums}
.chip{font-size:12px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
/* 开奖时间：还剩多久写着；已封盘红字，一眼看出这期还能不能收 */
#closeInfo{color:var(--dim)}
#closeInfo.closed{color:var(--red);font-weight:700}
#unpChip{cursor:pointer}
#unpChip b{color:var(--blue);text-decoration:underline dotted}
.grow{flex:1 1 auto}
.btn{border:1px solid var(--bd);background:#f7f8fa;color:var(--ink);
 padding:5px 11px;border-radius:4px;cursor:pointer;font-size:12.5px;
 text-decoration:none;display:inline-block}
.btn:hover{background:#eef1f4}
.btn.danger{color:var(--red);border-color:#e3b3ae;background:#fdf4f3}
.sel{border:1px solid var(--bd);border-radius:4px;padding:4px 6px;font-size:12.5px;
 background:#fff;color:var(--ink);outline:none;cursor:pointer}

/* ---------- 主体：左（盘面 + 平特 + 记账）右（两本排序） ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) clamp(272px,25vw,400px);
 gap:10px;align-items:start}
.left{display:flex;flex-direction:column;gap:10px;min-width:0}
.right{display:flex;flex-direction:column;gap:10px;min-width:0}

.panel{background:#fff;border:1px solid var(--bd);border-radius:5px;overflow:hidden;
 min-width:0}
.ph{background:var(--head);border-bottom:1px solid var(--bd);padding:6px 10px;
 font-size:13px;font-weight:700;color:#333d4b;display:flex;justify-content:space-between;
 align-items:center;gap:8px}
.ph .sub{font-weight:400;color:var(--dim);font-size:12px}

/* ---------- 号码盘：生肖列 + 5 列号码（最后一列放本盘合计） ---------- */
.boards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tb{display:grid;grid-template-columns:clamp(26px,2.6vw,40px) repeat(5,minmax(0,1fr));
 gap:2px;padding:6px}
.zb{background:var(--head);border:1px solid var(--bd2);border-radius:3px;
 display:flex;align-items:center;justify-content:center;font-size:var(--fs-zod);
 font-weight:800;color:#4a5463;min-height:clamp(22px,3vh,34px)}
.cell{display:flex;align-items:center;gap:clamp(3px,.4vw,6px);border:1px solid var(--bd2);
 border-radius:3px;padding:2px clamp(3px,.4vw,6px);background:var(--card);
 min-height:clamp(22px,3vh,34px);min-width:0}
.num{width:clamp(22px,2.1vw,30px);height:clamp(18px,2.4vh,24px);border-radius:3px;
 color:#fff;font-size:var(--fs-num);font-weight:700;display:flex;align-items:center;
 justify-content:center;font-variant-numeric:tabular-nums;flex:0 0 auto}
.num.r{background:var(--red)} .num.b{background:var(--blue)}
.num.g{background:var(--green)} .num.n{background:var(--grey)}
/* 金额紧跟号码，不推到格子右边 —— 与 GUI 一致，隔太远会看成两个格子 */
.amt{font-variant-numeric:tabular-nums;color:#aab3bf;
 font-size:var(--fs-amt);white-space:nowrap}
.amt.has{color:var(--ink);font-weight:800}
.cell.blank{background:transparent;border:none}
/* 本盘合计：钉在最后一列（49 号那一列）下半截，整列垂直居中 */
.psum{display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:2px;min-width:0}
.psum .lb{font-size:12px;color:var(--dim);white-space:nowrap}
.psum .v{font-size:clamp(13px,1.3vw,16px);font-weight:800;color:var(--red);
 font-variant-numeric:tabular-nums}

/* ---------- 平特：澳门 / 香港各一行 12 格 + 合计，右侧组合注 ---------- */
.flatbody{display:grid;grid-template-columns:minmax(0,1fr) clamp(200px,22vw,336px);
 gap:8px;padding:6px}
.zrows{display:flex;flex-direction:column;gap:4px;min-width:0}
.zrow{display:grid;grid-template-columns:clamp(38px,3.6vw,56px) repeat(12,minmax(0,1fr)) auto;
 gap:2px;align-items:stretch}
.zmk{display:flex;align-items:center;font-size:clamp(11px,1.05vw,12.5px);font-weight:800;
 color:#374151}
.zcell{background:var(--card);border:1px solid var(--bd2);border-radius:3px;
 display:flex;flex-direction:column;align-items:center;padding:2px 1px;min-width:0}
.zcell .z{font-size:clamp(11px,1.05vw,13px);font-weight:800;color:var(--blue)}
.zcell .a{font-size:clamp(10.5px,1vw,13px);font-weight:800;color:var(--red);
 font-variant-numeric:tabular-nums;white-space:nowrap}
.zcell .a.zero{color:var(--grey)}
.ztot{display:flex;align-items:center;padding-left:8px;font-size:clamp(13px,1.35vw,16px);
 font-weight:800;color:var(--red);white-space:nowrap;font-variant-numeric:tabular-nums}
/* 组合注：内容可滚，合计钉在右下角不动 */
.combo{display:flex;flex-direction:column;border:1px solid var(--bd2);border-radius:3px;
 background:var(--card);min-width:0;max-height:clamp(120px,15vh,190px)}
.combo-list{flex:1 1 auto;overflow:auto;padding:4px 6px}
.combo-empty{color:var(--dim);font-size:12px;padding:8px 4px}
.crow{display:flex;align-items:baseline;gap:6px;padding:1px 0}
.clb{font-size:clamp(11px,1vw,12.5px);font-weight:800;white-space:nowrap}
.czs{font-size:clamp(11px,1vw,12.5px);font-weight:800;color:#111827;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camt{margin-left:auto;font-size:clamp(11px,1vw,12.5px);font-weight:800;color:var(--red);
 white-space:nowrap;font-variant-numeric:tabular-nums}
.combo-sum{flex:0 0 auto;border-top:1px solid var(--bd2);padding:3px 8px;text-align:right;
 font-size:clamp(11px,1.05vw,12.5px);font-weight:800;color:var(--red);
 font-variant-numeric:tabular-nums;background:#fbfcfd}

/* ---------- 最近记账 / 消息 / 排序 表 ---------- */
.recbar{display:flex;gap:8px;align-items:center;padding:6px 8px;flex-wrap:wrap;
 border-bottom:1px solid var(--bd2);background:#fcfcfd}
.recbar .lbl{font-size:12px;color:var(--dim)}
.hint{font-size:12px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:clamp(11.5px,1.05vw,13px)}
th{text-align:left;background:var(--head);color:#333d4b;font-weight:700;padding:5px 7px;
 border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:5px 7px;border-bottom:1px solid var(--bd2);vertical-align:middle}
td.num2{font-variant-numeric:tabular-nums;white-space:nowrap}
td.txt{color:#5b6675;word-break:break-all}
td.who{white-space:nowrap;color:var(--blue);font-weight:700}
.tr{text-align:right}
.tc{text-align:center}
.hot{color:var(--red);font-weight:700}
.done{color:#9aa0a6}
.warm{color:#b45309;font-weight:700}
.empty{color:var(--dim);text-align:center;padding:16px 0;font-size:12.5px}
.scroll{overflow:auto;max-height:clamp(200px,30vh,340px)}
.oplink{color:var(--blue);cursor:pointer;font-weight:700;white-space:nowrap}
.oplink:hover{text-decoration:underline}
.oplink.off{color:#9aa0a6;cursor:default;text-decoration:none}
.mini{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;
 border:1px solid var(--bd2);color:var(--dim);background:var(--card);white-space:nowrap}
.mini.bad{color:var(--red);border-color:#e3b3ae;background:#fdf4f3}
.mini.ok{color:var(--green);border-color:#b7d9c7;background:#f2faf5}

/* ---------- 消息视图（点「本期未解析」进来，与 GUI 消息页对齐） ---------- */
#viewMsg{display:none}
.msgbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;
 border-bottom:1px solid var(--bd2);background:#fcfcfd}
.msghead{font-size:14px;font-weight:700;color:#111827;margin-bottom:8px}
.err{color:var(--red)}

/* ---------- 自适应 ---------- */
@media (max-width:1180px){
  .main{grid-template-columns:1fr}
  .right{display:grid;grid-template-columns:1fr 1fr;gap:10px}
}
@media (max-width:860px){
  .boards{grid-template-columns:1fr}
  .right{grid-template-columns:1fr}
  .flatbody{grid-template-columns:1fr}
  .combo{max-height:none}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 总览（与 GUI 概览页同样的块） ===== -->
  <div id="viewBoard">
    <div class="topbar">
      <div class="sumwrap"><span class="sum-l">总金额</span><span class="sum" id="grand">0</span></div>
      <span class="chip">本期 <b id="issue">—</b><span id="closeInfo"></span></span>
      <span class="chip">生肖年 <b id="zyear">—</b></span>
      <span class="chip">号码盘 <b id="desk">0</b></span>
      <span class="chip">平特 <b id="flat">0</b></span>
      <span class="chip">本期已记账 <b id="krec">0</b></span>
      <span class="chip" id="unpChip" title="点这里看是哪几条消息">本期未解析 <b id="kunp">0</b></span>
      <span class="grow"></span>
      <a class="btn" href="/manual" target="_blank">手工记账</a>
      <span class="chip">账号</span>
      <select class="sel" id="accSel" onchange="switchAcc(this.value)"></select>
    </div>

    <div class="main">
      <div class="left">
        <div class="boards">
          <section class="panel">
            <div class="ph">澳门 号码盘</div>
            <div class="tb" id="tbMO"></div>
          </section>
          <section class="panel">
            <div class="ph">香港 号码盘</div>
            <div class="tb" id="tbHK"></div>
          </section>
        </div>

        <section class="panel">
          <div class="ph">平特</div>
          <div class="flatbody">
            <div class="zrows" id="zrows"></div>
            <div class="combo">
              <div class="combo-list" id="comboList"></div>
              <div class="combo-sum" id="comboSum"></div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="ph">最近记账</div>
          <div class="recbar">
            <span class="lbl">账期</span>
            <select class="sel" id="recScope" onchange="onScope(this.value)"></select>
            <span class="hint" id="recHint">—</span>
          </div>
          <div class="scroll" id="recBody"></div>
        </section>
      </div>

      <div class="right">
        <section class="panel">
          <div class="ph">澳门 总额排序</div>
          <div class="scroll" id="riskMO"></div>
        </section>
        <section class="panel">
          <div class="ph">香港 总额排序</div>
          <div class="scroll" id="riskHK"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- ===== 消息（点顶栏「本期未解析」进来） ===== -->
  <div id="viewMsg">
    <section class="panel">
      <div class="msgbar">
        <button class="btn" onclick="backToBoard()">← 返回总览</button>
        <span class="msghead" id="msgHead">收到的消息</span>
        <span class="lbl" style="font-size:12px;color:var(--dim)">账期</span>
        <select class="sel" id="msgScope" onchange="onMsgScope(this.value)"></select>
        <span class="hint" id="msgHint">—</span>
        <span class="grow" style="flex:1"></span>
        <button class="btn" onclick="load()">刷新</button>
      </div>
      <div class="scroll" id="msgBody" style="max-height:none"></div>
    </section>
  </div>

</div>

<script>
/* ------------------------------------------------------------------
   数据来源：GET /api/board —— 服务端用 msb_view.summary 算，和桌面控制台
   是同一个函数，所以网页和 GUI 的数字不会各算各的。
   撤销：POST /api/board/reverse（只认本机来源，与控制台 /api/reverse 同一套账务逻辑）
------------------------------------------------------------------ */
let ACC = new URLSearchParams(location.search).get('account') || '';
let S = null;            // 最近一次接口数据
let SEL = '';            // 当前账期
let MGSEL = '';          // 消息页账期
let VIEW = 'board';
let SCOPES = [];         // [{label, issue}]

function fmt(v){
  const n = Number(v || 0);
  if (!n) return '0';
  return n.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
}
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function numClass(color){
  if (color === '红波') return 'r';
  if (color === '蓝波') return 'b';
  if (color === '绿波') return 'g';
  return 'n';
}
function issueOf(m){ return String(m.issue || ''); }
function bySel(rows, sel){
  return (rows || []).filter(x => issueOf(x) === sel);
}

/* ---------- 账号下拉 ---------- */
function syncAccounts(list){
  const sel = document.getElementById('accSel');
  const want = (list || []).slice();
  if (sel.dataset.n === want.join('|')) { sel.value = ACC; return; }
  sel.dataset.n = want.join('|');
  sel.innerHTML = '<option value="">全部账号（合计）</option>' +
    want.map(a => '<option value="' + esc(a) + '">' + esc(a) + '</option>').join('');
  sel.value = ACC;
}
function switchAcc(v){
  ACC = v || '';
  SEL = ''; MGSEL = '';
  load();
}

/* ---------- 账期下拉（本期 / 前一期 / 前二期，与 GUI 同一份选项） ---------- */
function syncScopes(list, cur){
  SCOPES = (list && list.length) ? list : [{label:'本期 ' + (cur || '—'), issue: cur || ''}];
  const sig = SCOPES.map(x => x.label).join('|');
  ['recScope','msgScope'].forEach(function(id){
    const el = document.getElementById(id);
    if (el.dataset.sig === sig) return;
    el.dataset.sig = sig;
    el.innerHTML = SCOPES.map(x =>
      '<option value="' + esc(x.issue) + '">' + esc(x.label) + '</option>').join('');
  });
  const okS = SCOPES.some(x => x.issue === SEL);
  if (!SEL || !okS) SEL = SCOPES[0].issue;
  const okM = SCOPES.some(x => x.issue === MGSEL);
  if (!MGSEL || !okM) MGSEL = SEL;
  document.getElementById('recScope').value = SEL;
  document.getElementById('msgScope').value = MGSEL;
}
function onScope(v){ SEL = v; renderRec(); }
function onMsgScope(v){ MGSEL = v; renderMsg(); }

/* ---------- 开奖时间封盘 ---------- */
let CUT = {left:0, draw:'', closed:true};
function fmtLeft(s){
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + ' 小时 ' + (m > 0 ? m + ' 分' : '');
  if (m > 0) return m + ' 分';
  return s + ' 秒';
}
function paintCutoff(){
  const el = document.getElementById('closeInfo');
  if (!el) return;
  if (CUT.closed || CUT.left <= 0){
    el.className = 'closed';
    el.textContent = ' · 已封盘（' + (CUT.draw || '') + ' 开奖）';
  } else {
    el.className = '';
    el.textContent = ' · ' + CUT.draw + ' 截止（剩 ' + fmtLeft(CUT.left) + '）';
  }
}
setInterval(function(){
  if (CUT.left > 0){
    CUT.left -= 1;
    if (CUT.left <= 0){ CUT.closed = true; load(); }
    paintCutoff();
  }
}, 1000);

/* ---------- 顶栏 ---------- */
function renderTop(){
  const d = S;
  document.getElementById('grand').textContent = fmt(d.grand_total);
  document.getElementById('issue').textContent = d.issue || '—';
  document.getElementById('zyear').textContent =
    (d.zodiac_year || '—') + '年' + (d.zodiac ? ' · ' + d.zodiac : '');
  // 「号码盘」只算逐号注（澳 + 港两本盘面之和），平特/连肖/组合注单独一个「平特」。
  // 以前这里跟总金额一样取 grand_total，等于把平特的钱又算进号码盘，两个数永远相等。
  const deskTot = (((d.markets || {}).ALL || {}).board) || 0;
  document.getElementById('desk').textContent = fmt(deskTot);
  document.getElementById('flat').textContent = fmt(d.flat_total);
  document.getElementById('krec').textContent = d.records_current || 0;
  document.getElementById('kunp').textContent = unparsedCount();
}

/* 未解析数：与 GUI 一样从消息流水里数（result=未解析 且属于当前账期），
   拿不到流水时才退回服务端给的 unparsed_current */
function unparsedCount(){
  const rows = bySel(S.messages, SEL);
  if (!rows.length) return (SEL === S.issue ? (S.unparsed_current || 0) : 0);
  return rows.filter(m => String(m.result || '') === '未解析').length;
}

/* ---------- 号码盘（生肖列 + 5 列号码，最后一列放本盘合计） ---------- */
function renderBoard(mk){
  const el = document.getElementById('tb' + mk);
  const rows = (S.grids || {})[mk] || [];
  if (!rows.length){
    el.innerHTML = '<div class="empty" style="grid-column:1/-1">暂无号码表</div>';
    return;
  }
  let html = '', total = 0;
  rows.forEach(function(r, ri){
    const R = ri + 1;
    // 每个格子都写死行列：靠自动流的话，被「本盘合计」占住的第 6 列会把后面的
    // 格子顶前一位，整盘错行（踩过）。
    html += '<div class="zb" style="grid-row:' + R + ';grid-column:1">' +
      esc(r.zodiac) + '</div>';
    const cells = r.cells || [];
    for (let c = 0; c < 5; c++){
      const cell = cells[c];
      if (!cell) continue;   // 只有 4 个号的行，第 5 格空着 —— 与 GUI 一样不画框
      total += Number(cell.amount || 0);
      html += '<div class="cell" style="grid-row:' + R + ';grid-column:' + (c + 2) + '">' +
        '<span class="num ' + numClass(cell.color) + '">' + esc(cell.num) + '</span>' +
        '<span class="amt' + (cell.amount > 0 ? ' has' : '') + '">' +
        (cell.amount > 0 ? fmt(cell.amount) : '') + '</span></div>';
    }
  });
  // 本盘合计只加盘面上这些号的钱（平特 / 连肖 / 组合注不在 49 号盘里），
  // 位置固定在最后一列第二行往下，像 GUI 那样竖着占满那一列的空白
  html += '<div class="psum" style="grid-row:2 / span 11;grid-column:6">' +
    '<span class="lb">本盘合计</span><span class="v">' + fmt(total) + '</span></div>';
  el.innerHTML = html;
}

/* ---------- 平特：生肖 12 格 + 合计；组合注在右侧 ---------- */
const ZHONG_CLR = {'二中二':'#1f6feb','三中二':'#0e7490','三中三':'#7c3aed',
                   '四中四':'#c2410c','五中五':'#c0392b','六中六':'#0f766e'};
const ZHONG_RANK = {二:2, 三:3, 四:4, 五:5, 六:6};
const ZS_ORDER = '鼠牛虎兔龙蛇马羊猴鸡狗猪'.split('');

function renderFlat(){
  const zb = S.zodiac_board || {};
  const rowsEl = document.getElementById('zrows');
  let html = '';
  let comboAgg = {};
  ['MO','HK'].forEach(function(mk){
    const b = zb[mk] || {};
    const rows = b.rows || [];
    html += '<div class="zrow"><div class="zmk">' + (mk === 'MO' ? '澳门' : '香港') + '</div>';
    ZS_ORDER.forEach(function(z, i){
      const row = rows[i] || {};
      const amt = Number(row.amount || 0);
      html += '<div class="zcell"><span class="z">' + esc(z) + '</span><span class="a' +
        (amt ? '' : ' zero') + '">' + (amt ? fmt(amt) : '0') + '</span></div>';
    });
    html += '<div class="ztot">合计 ' + fmt((b.totals || {}).board) + '</div></div>';
    // 组合注：港澳合并，同类同生肖合成一笔
    (b.combo_groups || []).forEach(function(g){
      const lb = String(g.label || '二中二');
      const zs = (g.zodiacs || []).filter(Boolean);
      const key = lb + '|' + zs.slice().sort((x, y) =>
        ZS_ORDER.indexOf(x) - ZS_ORDER.indexOf(y)).join('');
      if (!comboAgg[key]) comboAgg[key] = {label: lb, zodiacs: zs, amount: 0};
      comboAgg[key].amount += Number(g.amount || 0);
    });
  });
  rowsEl.innerHTML = html;

  const list = Object.values(comboAgg).sort(function(a, b){
    const ra = ZHONG_RANK[a.label[0]] || 9, rb = ZHONG_RANK[b.label[0]] || 9;
    if (ra !== rb) return ra - rb;
    return a.zodiacs.map(z => ZS_ORDER.indexOf(z)).join(',')
      .localeCompare(b.zodiacs.map(z => ZS_ORDER.indexOf(z)).join(','));
  });
  let total = 0;
  document.getElementById('comboList').innerHTML = list.length ? list.map(function(g){
    total += g.amount;
    const clr = ZHONG_CLR[g.label] || ZHONG_CLR[g.zodiacs[0]] || 'var(--blue)';
    return '<div class="crow"><span class="clb" style="color:' + clr + '">' +
      esc(g.label) + '：</span><span class="czs">' +
      esc(g.zodiacs.join('+') || '—') + '</span><span class="camt">共' +
      fmt(g.amount) + '元</span></div>';
  }).join('') : '<div class="combo-empty">组合注：本期没有</div>';
  document.getElementById('comboSum').textContent = list.length
    ? ('合计：' + fmt(total) + ' 元') : '';
}

/* ---------- 总额排序（两本，序 / 号码 / 生肖 / 金额 / 占比） ---------- */
function renderRisk(){
  ['MO','HK'].forEach(function(mk){
    const el = document.getElementById('risk' + mk);
    const rows = (S.risks || {})[mk] || [];
    if (!rows.length){
      el.innerHTML = '<div class="empty">本期这盘还没有下注</div>';
      return;
    }
    el.innerHTML = '<table><tr><th class="tc">序</th><th class="tc">号码</th>' +
      '<th class="tc">生肖</th><th class="tr">金额</th><th class="tr">占比</th></tr>' +
      rows.map(x => '<tr><td class="num2 tc">' + x.rank + '</td>' +
        '<td class="num2 tc">' + esc(x.num) + '</td>' +
        '<td class="tc">' + esc(x.zodiac) + '</td>' +
        '<td class="num2 tr' + (x.rank === 1 ? ' hot' : '') + '">' + fmt(x.amount) + '</td>' +
        '<td class="num2 tr">' + x.share + '%</td></tr>').join('') + '</table>';
  });
}

/* ---------- 最近记账：账期 + 统计 + 8 列表格（含撤销） ---------- */
function renderRec(){
  const rows = bySel(S.recent, SEL);
  const mine = bySel(S.messages, SEL);
  const ok = mine.filter(m => String(m.result || '') === '记账');
  const rev = ok.filter(m => m.reversed).length;
  const test = ok.filter(m => ['规则测试','自检'].includes(String(m.chat || ''))).length;
  const manual = rows.filter(x => String(x.sender || '') === 'manual'
    || String(x.chat || x.chat_name || '') === '手工记账').length;
  document.getElementById('recHint').textContent =
    (SEL || '—') + ' · 消息记账 ' + ok.length + ' 笔（测试 ' + test + ' · 已撤 ' + rev +
    '）· 账目 ' + rows.length + ' 笔（手工 ' + manual + '）';

  const el = document.getElementById('recBody');
  if (!rows.length){
    el.innerHTML = '<div class="empty">这一期还没有记账</div>';
    return;
  }
  el.innerHTML = '<table><tr><th>时间</th><th>期号</th><th>会话</th><th>发送人</th>' +
    '<th>原文</th><th class="tr">号码</th><th class="tr">本单</th><th class="tc">操作</th></tr>' +
    rows.map(function(x){
      const rid = String(x.msg_id || x.rec_id || '');
      const done = !!x.reversed;
      const op = done
        ? '<span class="oplink off">已撤销</span>'
        : '<span class="oplink" data-mid="' + esc(rid) + '" onclick="undo(this)">撤销</span>';
      return '<tr><td class="num2">' + esc(String(x.ts || '').slice(0,16)) + '</td>' +
        '<td class="num2">' + esc(x.issue || '') + '</td>' +
        '<td>' + esc(String(x.chat || x.chat_name || '').slice(0,24)) + '</td>' +
        '<td class="who' + (done ? ' done' : '') + '">' +
          esc(String(x.sender_name || x.sender || '').slice(0,14)) + '</td>' +
        '<td class="txt">' + esc(String(x.text || '').slice(0,70)) + '</td>' +
        '<td class="num2 tr">' + (x.numbers || 0) + '</td>' +
        '<td class="num2 tr' + (done ? ' done' : '') + '">' + fmt(x.total) + '</td>' +
        '<td class="tc">' + op + '</td></tr>';
    }).join('') + '</table>';
}

/* ---------- 消息页（与 GUI「消息」页同样的列） ---------- */
function renderMsg(){
  const rows = bySel(S.messages, MGSEL);
  const head = document.getElementById('msgHead');
  const hint = document.getElementById('msgHint');
  const unp = rows.filter(m => String(m.result || '') === '未解析').length;
  head.textContent = '收到的消息';
  hint.textContent = (MGSEL || '—') + ' · 共 ' + rows.length + ' 条 · 未解析 ' + unp + ' 条';
  const el = document.getElementById('msgBody');
  if (!rows.length){
    el.innerHTML = '<div class="empty">这一期还没收到消息</div>';
    return;
  }
  el.innerHTML = '<table><tr><th>时间</th><th>账号</th><th>会话</th><th>发送人</th>' +
    '<th>内容</th><th>结果</th></tr>' +
    rows.map(function(m){
      const res = String(m.result || '');
      const reason = String(m.reason || '');
      const amt = m.amount;
      let label, cls = '', op = '';
      if (res === '记账'){
        label = '记账' + (amt == null ? '' : ' ¥' + fmt(amt));
        if (m.reversed){ cls = 'done'; label = '已撤销 · 原 ' + label; }
        else { cls = ''; op = '<span class="oplink" data-mid="' + esc(m.msg_id || '') +
              '" onclick="undo(this)">撤销</span>'; }
      } else {
        label = res + (reason ? ' · ' + (reason.length > 12 ? reason.slice(0,12) + '…' : reason) : '');
        if (res === '未解析') cls = 'hot';
        else if (res === '已冲正') cls = 'warm';   /* 客户撤回冲正：账动了，别用灰字 */
        else cls = 'done';
      }
      return '<tr><td class="num2">' + esc(String(m.ts || '').slice(0,16)) + '</td>' +
        '<td>' + esc(m.account || m.cust || '') + '</td>' +
        '<td>' + esc(String(m.chat || '').slice(0,24)) + '</td>' +
        '<td class="who">' + esc(String(m.sender || m.sender_name || '').slice(0,14)) + '</td>' +
        '<td class="txt">' + esc(String(m.content || m.text || '').slice(0,90)) + '</td>' +
        '<td class="' + cls + '">' + esc(label) + ' ' + op + '</td></tr>';
    }).join('') + '</table>';
}

/* ---------- 视图切换 ---------- */
function showUnparsed(){
  VIEW = 'msg';
  MGSEL = SEL;
  document.getElementById('viewBoard').style.display = 'none';
  document.getElementById('viewMsg').style.display = '';
  document.getElementById('msgScope').value = MGSEL;
  renderMsg();
  window.scrollTo(0, 0);
}
function backToBoard(){
  VIEW = 'board';
  document.getElementById('viewMsg').style.display = 'none';
  document.getElementById('viewBoard').style.display = '';
  window.scrollTo(0, 0);
}

/* ---------- 撤销 ---------- */
async function undo(el){
  const mid = el.dataset.mid;
  if (!mid) return;
  if (!confirm('确定撤销这一笔账？金额会从账本里减掉，撤销记录会留在流水里。')) return;
  try{
    const r = await fetch('/api/board/reverse', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({msg_id: mid})
    });
    const d = await r.json();
    if (!d.ok){ alert('撤销失败：' + (d.error || '未知错误')); return; }
    load();
  }catch(e){ alert('撤销失败：' + e); }
}

/* ---------- 主循环 ---------- */
async function load(){
  try{
    const r = await fetch('/api/board' + (ACC ? '?account=' + encodeURIComponent(ACC) : ''));
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '读取失败');
    S = d;
    syncAccounts(d.accounts);
    syncScopes(d.issue_options, d.issue);
    CUT = {left: Number(d.seconds_left || 0), draw: d.draw_time || '', closed: !!d.closed};
    renderTop(); paintCutoff();
    renderBoard('MO'); renderBoard('HK');
    renderFlat(); renderRisk(); renderRec(); renderMsg();
  }catch(e){
    const el = document.getElementById('recHint');
    if (el) el.innerHTML = '<span class="err">刷新失败：' + esc(e.message || e) + '</span>';
  }
}

document.getElementById('unpChip').addEventListener('click', showUnparsed);
load();
setInterval(load, 5000);
</script>
