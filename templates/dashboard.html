<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记账中台</title>
<style>
:root{
  --bd:#ccd2da; --bd2:#e3e7ec; --ink:#1b212c; --dim:#78818f;
  --bg:#f1f3f5; --head:#eaeef2;
  --red:#c0392b; --blue:#2b6cb0; --green:#2b8a5f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:13px/1.45 "Microsoft YaHei","Segoe UI",Arial,sans-serif;padding:14px}
.wrap{max-width:1460px;margin:0 auto}

.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
 background:#fff;border:1px solid var(--bd);border-radius:5px;
 padding:9px 14px;margin-bottom:10px}
.title{font-size:16px;font-weight:700;letter-spacing:1.5px}
.sumbox{display:flex;align-items:baseline;gap:6px}
.sum-l{font-size:12px;color:var(--dim)}
.sum{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--red)}
.chip{font-size:12px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.sp{flex:1}
.btn{border:1px solid var(--bd);background:#f7f8fa;color:var(--ink);
 padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12.5px}
.btn:hover{background:#eef1f4}
.btn.danger{color:var(--red);border-color:#e3b3ae;background:#fdf4f3}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;align-items:start}
.panel{background:#fff;border:1px solid var(--bd);border-radius:5px;overflow:hidden}
.ph{background:var(--head);border-bottom:1px solid var(--bd);
 padding:7px 10px;font-size:12.5px;font-weight:600;color:#3d4654;
 display:flex;justify-content:space-between;align-items:center}
.ph span{font-weight:400;color:var(--dim);font-size:12px}

.rows{padding:6px}
.row{display:grid;grid-template-columns:30px repeat(5,1fr);gap:2px;margin-bottom:2px}
.zod{background:var(--head);border:1px solid var(--bd2);border-radius:3px;
 display:flex;align-items:center;justify-content:center;
 font-size:12px;font-weight:600;color:#4a5463}
.cell{display:flex;align-items:center;gap:5px;border:1px solid var(--bd2);
 border-radius:3px;padding:2px 5px;background:#fafbfc;min-height:25px}
.num{width:25px;height:20px;border-radius:3px;color:#fff;font-size:12px;
 font-weight:600;display:flex;align-items:center;justify-content:center;
 font-variant-numeric:tabular-nums;flex:0 0 auto}
.num.r{background:var(--red)} .num.b{background:var(--blue)}
.num.g{background:var(--green)} .num.n{background:#aab2bd}
.amt{margin-left:auto;font-variant-numeric:tabular-nums;color:#b0b8c2;font-size:12px}
.amt.has{color:var(--ink);font-weight:700}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;background:var(--head);color:#3d4654;font-weight:600;
 padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:12px}
td{padding:6px 8px;border-bottom:1px solid var(--bd2);vertical-align:top}
td.num2{font-variant-numeric:tabular-nums;white-space:nowrap}
td.txt{color:#5b6675;word-break:break-all;max-width:420px}
td.who{white-space:nowrap;color:#1f6feb;font-weight:600}
.tr{text-align:right}
.hot{color:var(--red);font-weight:700}
.empty{color:var(--dim);text-align:center;padding:24px 0;font-size:12.5px}

.foot{margin-top:10px;color:#98a1ad;font-size:12px;padding-left:2px}
.mini{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;
 border:1px solid var(--bd2);color:var(--dim);background:#fafbfc}
.mini.bad{color:var(--red);border-color:#e3b3ae;background:#fdf4f3}
.mini.ok{color:var(--green);border-color:#b7d9c7;background:#f2faf5}

.lstbar{display:flex;gap:8px;align-items:center;padding:7px 10px;
 border-bottom:1px solid var(--bd2);flex-wrap:wrap;background:#fcfcfd}
#lstSearch{border:1px solid var(--bd);border-radius:4px;padding:5px 8px;
 font-size:12.5px;width:240px;outline:none}
#lstSearch:focus{border-color:#9aa8ba}
#lstKind{border:1px solid var(--bd);border-radius:4px;padding:5px 6px;
 font-size:12.5px;background:#fff;color:var(--ink);outline:none;cursor:pointer}
#accSel{border:1px solid var(--bd);border-radius:4px;padding:5px 6px;
 font-size:12.5px;background:#fff;color:var(--ink);outline:none;cursor:pointer}
#lstBody{max-height:360px;overflow:auto}
td.ck{width:34px;text-align:center}
td.kind{white-space:nowrap}
td.wxid{color:#8a929e;font-size:11.5px;word-break:break-all;max-width:280px}

@media (max-width:900px){
  .grid2{grid-template-columns:1fr}
  .row{grid-template-columns:26px repeat(5,1fr)}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="title">记账中台</div>
    <div class="sumbox">
      <span class="sum-l">本期金额</span>
      <span class="sum" id="grand">0</span>
    </div>
    <div class="chip">本期 <b id="issue">—</b></div>
    <div class="chip">生肖年 <b id="zyear">—</b></div>
    <div class="chip">有注号码 <b id="kbets">—</b></div>
    <div class="chip">今日已记账 <b id="krec">—</b></div>
    <div class="chip">今日未解析 <b id="kunp">—</b></div>
    <div class="sp"></div>
    <select id="accSel" onchange="switchAcc(this.value)" style="display:none"></select>
    <div class="chip" id="meta">—</div>
    <div class="chip">备份 / 清空请在桌面控制台操作</div>
    <a class="btn" href="/manual" style="text-decoration:none">手工记账</a>
    <button class="btn" onclick="load()">刷新</button>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="ph">号码盘 <span id="gridHint">按生肖分行 · 号码底色为波色</span></div>
      <div class="rows" id="grid"></div>
    </div>

    <div class="panel">
      <div class="ph">总额大小排序 <span>风险值</span></div>
      <div id="risk"></div>
    </div>
  </div>

  <div class="panel" style="margin-top:10px">
    <div class="ph">最近记账 <span>最新在上</span></div>
    <div id="recent"></div>
  </div>

  <div class="panel" style="margin-top:10px">
    <div class="ph">监听对象 <span id="lstMeta">—</span></div>
    <div class="lstbar">
      <input id="lstSearch" placeholder="搜索群名 / 好友 / 微信号" oninput="renderList()">
      <select id="lstKind" onchange="renderList()">
        <option value="">全部类型</option>
        <option value="群">群</option>
        <option value="好友">好友</option>
        <option value="公众号">公众号</option>
      </select>
      <span class="chip">已勾选 <b id="lstSel">0</b> 个</span>
      <div class="sp"></div>
      <button class="btn" onclick="loadContacts()">刷新清单</button>
      <button class="btn" onclick="saveTargets()">保存并下发</button>
    </div>
    <div id="lstBody"><div class="empty">正在读取…</div></div>
  </div>

  <div class="panel" style="margin-top:10px">
    <div class="ph">未解析（需人工核对） <span>原文已留在 unparsed.jsonl</span></div>
    <div id="unparsed"></div>
  </div>

  <div class="foot">每 5 秒自动刷新 · 数据来自 WxPushTool 的微信推送</div>
</div>

<script>
function fmt(v){
  const n = Number(v || 0);
  if (!n) return '0';
  return n.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
}
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function numClass(color){
  if (color === '红波') return 'r';
  if (color === '蓝波') return 'b';
  if (color === '绿波') return 'g';
  return 'n';
}

// ---------- 账号切换 ----------
// 空串 = 所有账号合计的总览；选了具体账号 = 只看这个号的账本和监听配置。
// 监听对象是按账号分开的，所以配置前必须先选账号。
// 支持 /?account=xxx 直接进单号视图（方便单独收藏某一个号的看板）。
let ACC = new URLSearchParams(location.search).get('account') || '';

function fillAccounts(list){
  const sel = document.getElementById('accSel');
  if (!list || !list.length){ sel.style.display = 'none'; return; }
  if (list.length === 1){
    // 只有一个账号：合计就等于它，不用让用户选；但监听对象必须按账号读
    sel.style.display = 'none';
    if (ACC !== list[0]){ ACC = list[0]; loadContacts(); }
    return;
  }
  if (sel.dataset.n === String(list.length)) return;
  sel.dataset.n = String(list.length);
  sel.innerHTML = '<option value="">全部账号（合计）</option>' +
    list.map(a => '<option value="' + esc(a) + '">' + esc(a) + '</option>').join('');
  sel.style.display = '';
  sel.value = ACC;
}

function switchAcc(v){
  ACC = v || '';
  load();
  loadContacts();
}

async function load(){
  try{
    const r = await fetch('/api/dashboard' + (ACC ? '?account=' + encodeURIComponent(ACC) : ''));
    const d = await r.json();
    fillAccounts(d.accounts);

    document.getElementById('grand').textContent = fmt(d.grand_total);
    document.getElementById('issue').textContent = d.issue || '—';
    document.getElementById('zyear').textContent = (d.zodiac_year || '—') + '年';
    document.getElementById('kbets').textContent = d.numbers_with_bets;
    document.getElementById('krec').textContent = d.records_today;
    document.getElementById('kunp').textContent = d.unparsed_today;
    document.getElementById('meta').innerHTML =
      (d.account ? '账号 ' + esc(d.account) : '全部账号合计') + ' · ' +
      esc(d.model) + ' · ' + (d.verify_enabled ? '验签开' : '验签跳') +
      ' · ' + esc(d.server_time);

    if (!d.grid.length){
      document.getElementById('grid').innerHTML = '<div class="empty">暂无号码表</div>';
    } else {
      document.getElementById('grid').innerHTML = d.grid.map(row => `
        <div class="row">
          <div class="zod">${esc(row.zodiac)}</div>
          ${row.cells.map(c => `
            <div class="cell">
              <span class="num ${numClass(c.color)}">${esc(c.num)}</span>
              <span class="amt ${c.amount > 0 ? 'has' : ''}">${fmt(c.amount)}</span>
            </div>`).join('')}
        </div>`).join('');
    }

    if (!d.risk.length){
      document.getElementById('risk').innerHTML = '<div class="empty">暂无数据</div>';
    } else {
      document.getElementById('risk').innerHTML = `<table>
        <tr><th>序</th><th>号码</th><th>生肖</th><th class="tr">金额</th><th class="tr">占比</th></tr>
        ${d.risk.map(x => `<tr>
          <td class="num2">${x.rank}</td>
          <td class="num2">${esc(x.num)}</td>
          <td>${esc(x.zodiac)}</td>
          <td class="num2 tr ${x.rank === 1 ? 'hot' : ''}">${fmt(x.amount)}</td>
          <td class="num2 tr">${x.share}%</td>
        </tr>`).join('')}
      </table>`;
    }

    if (!d.recent.length){
      document.getElementById('recent').innerHTML = '<div class="empty">还没有记账</div>';
    } else {
      document.getElementById('recent').innerHTML = `<table>
        <tr><th>时间</th><th>会话</th><th>发送人</th><th>原文</th><th class="tr">号码</th><th class="tr">本单</th><th class="tr">累计</th></tr>
        ${d.recent.map(x => `<tr>
          <td class="num2">${esc(x.ts)}</td>
          <td>${esc(x.chat)}</td>
          <td class="who">${esc(x.sender_name || x.sender || '')}</td>
          <td class="txt">${esc(x.text)}</td>
          <td class="num2 tr">${x.numbers || 0}</td>
          <td class="num2 tr">${fmt(x.total)}</td>
          <td class="num2 tr">${fmt(x.grand_total)}</td>
        </tr>`).join('')}
      </table>`;
    }

    if (!d.unparsed_recent.length){
      document.getElementById('unparsed').innerHTML = '<div class="empty">没有未解析的单</div>';
    } else {
      document.getElementById('unparsed').innerHTML = `<table>
        <tr><th>时间</th><th>会话</th><th>原文</th><th>原因</th></tr>
        ${d.unparsed_recent.map(x => `<tr>
          <td class="num2">${esc(x.ts)}</td>
          <td>${esc(x.chat)}</td>
          <td class="txt">${esc(x.text)}</td>
          <td><span class="mini bad">${esc(x.reason)}</span></td>
        </tr>`).join('')}
      </table>`;
    }
  }catch(e){
    document.getElementById('meta').textContent = '刷新失败：' + e;
  }
}

async function act(path){
  try{
    const r = await fetch(path, {method:'POST'});
    await r.json();
    load();
  }catch(e){ alert('操作失败：' + e); }
}

// 备份 / 清空不放在网页看板上：这两个接口要控制台令牌，浏览器拿不到。
// 看板只负责看数，动账的操作都在桌面控制台里。

// ---------- 监听对象 ----------
// 清单由采集端上报（只含「有过会话」的对象）；勾选结果存 id、version+1 后
// 由采集端拉走。5 秒自动刷新不碰这个区块，避免把用户正在勾的选择冲掉。
let LST = {items: []};

async function loadContacts(){
  const box = document.getElementById('lstBody');
  if (!ACC){
    // 监听配置是按账号分开的，"全部账号合计"视图下没法勾
    LST.items = [];
    document.getElementById('lstMeta').textContent = '未选择账号';
    box.innerHTML = '<div class="empty">监听对象按微信号分开配置。' +
      '请先在右上角选择一个账号（只有一个账号时会自动选中）。</div>';
    updateSelCount();
    return;
  }
  try{
    const r = await fetch('/api/contacts?account=' + encodeURIComponent(ACC));
    const d = await r.json();
    if (!d.ok){
      box.innerHTML = '<div class="empty">' + esc(d.error || '不可用') + '</div>';
      return;
    }
    // 排序：群 > 好友 > 文件助手 > 公众号，同类按最近消息倒序。
    // 公众号可能上百个，若不留神会占满第一屏，把真正想监听的群冲下去。
    const ORDER = {'群': 0, '好友': 1, '文件助手': 2, '公众号': 3};
    LST.items = (d.items || []).slice().sort((a, b) =>
      ((ORDER[a.kind] != null ? ORDER[a.kind] : 9) - (ORDER[b.kind] != null ? ORDER[b.kind] : 9))
      || ((b.last_msg_time || 0) - (a.last_msg_time || 0)));
    document.getElementById('lstMeta').innerHTML =
      (d.received_at ? '清单同步 ' + esc(d.received_at) : '采集端尚未上报') +
      ' · 下发版本 v' + (d.targets_version || 0) +
      ' · 生效中 ' + (d.targets_count || 0) + ' 个';
    renderList();
  }catch(e){
    box.innerHTML = '<div class="empty">读取失败：' + esc(e) + '</div>';
  }
}

function renderList(){
  const box = document.getElementById('lstBody');
  const kw = (document.getElementById('lstSearch').value || '').trim().toLowerCase();
  const all = LST.items;

  if (!all.length){
    box.innerHTML = '<div class="empty">还没有会话清单。采集端（WxPushTool）启动约 5 分钟后自动上报，' +
      '只包含「有过会话」的对象——从没聊过的联系人监听不到，所以不列出来。</div>';
    updateSelCount();
    return;
  }

  const rows = !kw ? all : all.filter(x =>
    ((x.name || '') + ' ' + (x.chat_id || '') + ' ' + (x.kind || '') + ' ' + (x.alias || ''))
      .toLowerCase().indexOf(kw) >= 0);

  const kind = document.getElementById('lstKind').value;
  const shown = kind ? rows.filter(x => (x.kind || '') === kind) : rows;

  if (!shown.length){
    box.innerHTML = '<div class="empty">没有匹配的对象</div>';
    updateSelCount();
    return;
  }

  box.innerHTML = `<table>
    <tr><th class="ck"></th><th>名称</th><th>类型</th><th>微信ID</th><th class="tr">最近消息</th></tr>
    ${shown.map(x => `<tr>
      <td class="ck"><input type="checkbox" class="ckbox" data-id="${esc(x.chat_id)}"
        ${x.selected ? 'checked' : ''} onchange="updateSelCount()"></td>
      <td>${esc(x.name)}</td>
      <td class="kind"><span class="mini ${x.kind === '群' ? 'ok' : ''}">${esc(x.kind || '')}</span></td>
      <td class="wxid">${esc(x.chat_id)}</td>
      <td class="num2 tr">${x.last_msg_time
        ? esc(new Date(x.last_msg_time * 1000).toLocaleString()) : '—'}</td>
    </tr>`).join('')}
  </table>`;
  updateSelCount();
}

function updateSelCount(){
  const n = document.querySelectorAll('#lstBody input.ckbox:checked').length;
  document.getElementById('lstSel').textContent = n;
}

async function saveTargets(){
  if (!ACC){ alert('请先在右上角选择一个账号，再配置它的监听对象。'); return; }
  const ids = Array.from(document.querySelectorAll('#lstBody input.ckbox:checked'))
    .map(e => e.dataset.id).filter(Boolean);
  if (!ids.length && !confirm('当前没有勾选任何对象，保存后采集端将停止监听所有会话。确定继续？')) {
    return;
  }
  try{
    const r = await fetch('/api/targets', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({targets: ids, account: ACC})
    });
    const d = await r.json();
    if (!d.ok){ alert('保存失败：' + (d.error || '未知错误')); return; }
    alert('已保存 ' + d.count + ' 个监听对象（版本 v' + d.version + '）\n采集端约 60 秒内自动生效。');
    loadContacts();
  }catch(e){
    alert('保存失败：' + e);
  }
}

load();
loadContacts();
setInterval(load, 5000);
</script>
</body>
</html>
