<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>手工记账</title>
<style>
:root{
  --bd:#ccd2da; --bd2:#e3e7ec; --ink:#1b212c; --dim:#78818f;
  --bg:#f1f3f5; --head:#eaeef2;
  --red:#c0392b; --blue:#2b6cb0; --green:#2b8a5f;
  --pick:#111827; --gold:#f59e0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:14.5px/1.5 "Microsoft YaHei","Segoe UI",Arial,sans-serif;padding:12px}
.wrap{max-width:1500px;margin:0 auto}

/* 顶栏 */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
 background:#fff;border:1px solid var(--bd);border-radius:6px;padding:8px 14px;margin-bottom:10px}
.title{font-size:17px;font-weight:700;letter-spacing:1px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:5px;overflow:hidden}
.seg button{border:0;background:#f7f8fa;color:#374151;padding:6px 16px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.lbl{font-size:12.5px;color:var(--dim)}
input,select{border:1px solid var(--bd);border-radius:4px;padding:6px 8px;font-size:13px;
 font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #bfd4ee;outline-offset:-1px}
.btn{border:1px solid var(--bd);background:#f7f8fa;color:var(--ink);
 padding:7px 14px;border-radius:5px;cursor:pointer;font-size:13px}
.btn:hover{background:#eef1f4}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.btn.pri:hover{background:#24609f}
.btn.pri:disabled{background:#9bb4dd;border-color:#9bb4dd;cursor:not-allowed}
.btn.big{padding:10px 18px;font-size:14.5px}
.sp{flex:1}

/* 两栏 */
.main{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:12px;align-items:start}
.panel{background:#fff;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.ph{background:var(--head);border-bottom:1px solid var(--bd);padding:8px 12px;
 font-size:13.5px;font-weight:600;color:#3d4654;display:flex;justify-content:space-between;align-items:center}
.ph span{font-weight:400;color:var(--dim);font-size:12.5px}
.pad{padding:10px 12px}

/* 号码盘 7×7 */
.numpad{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.nb{position:relative;border:2px solid transparent;border-radius:5px;color:#fff;
 font:700 clamp(16px,1.55vw,26px)/1 "Consolas","Microsoft YaHei",monospace;
 display:flex;align-items:center;justify-content:center;
 height:clamp(38px,4.4vw,56px);cursor:pointer;user-select:none;
 transition:border-color .08s,transform .08s}
.nb:hover{transform:translateY(-1px)}
.nb.r{background:var(--red)} .nb.b{background:var(--blue)}
.nb.g{background:var(--green)} .nb.n{background:#9aa3ae}
.nb.on{border-color:var(--pick);box-shadow:0 0 0 2px rgba(255,255,255,.7) inset}

/* 生肖 */
.zrow{display:flex;flex-wrap:wrap;gap:6px}
.zb{border:1px solid var(--bd);background:#eef0f3;color:#374151;border-radius:4px;
 padding:7px 14px;font-size:clamp(14px,1.1vw,18px);cursor:pointer;min-width:52px;text-align:center}
.zb.on{background:#fde68a;border-color:var(--gold);color:#92400e;font-weight:700}

/* 玩法 */
.grp{margin-top:11px}
.gname{font-size:clamp(12.5px,1vw,14px);color:var(--dim);margin:0 0 5px 1px}
.plays{display:flex;flex-wrap:wrap;gap:6px}
.pb{border:1px solid var(--bd);background:#f7f8fa;color:#374151;border-radius:4px;
 padding:6px 13px;font-size:clamp(13px,1.05vw,17px);cursor:pointer}
.pb.on{background:#dbeafe;border-color:#93c5fd;color:#1e40af;font-weight:700}

/* 提示条 */
.hint{margin:10px 12px 0;border:1px dashed var(--bd);border-radius:5px;
 padding:9px 11px;font-size:clamp(13px,1.05vw,16px);color:#3d4654;background:#fbfcfd;min-height:38px}
.hint.warn{color:#b45309;border-color:#fcd34d;background:#fffbeb}
.hint.ok{color:#1f6feb}

/* 右栏 */
.who{width:100%}
.amtline{display:flex;gap:6px;align-items:center}
.amtline input{flex:1;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.qb{border:1px solid var(--bd);background:#f7f8fa;border-radius:4px;
 padding:6px 12px;font-size:clamp(13px,1vw,15px);cursor:pointer;font-variant-numeric:tabular-nums}
.mini{display:inline-block;padding:0 5px;border-radius:9px;font-size:11px;
 border:1px solid var(--bd2);color:var(--dim);background:#fafbfc;margin-left:4px}

table{width:100%;border-collapse:collapse;font-size:clamp(13px,1vw,15px)}
th{text-align:left;background:var(--head);color:#3d4654;font-weight:600;
 padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:clamp(12.5px,.95vw,14px)}
td{padding:7px 8px;border-bottom:1px solid var(--bd2);vertical-align:middle}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
td.item{color:#22303f;word-break:break-all}
.row-x{color:#b0b8c2;cursor:pointer;font-weight:700;padding:0 4px}
.row-x:hover{color:var(--red)}
tr.sel{background:#f3f7fd}
.empty{padding:18px 10px;text-align:center;color:var(--dim);font-size:13.5px}

.sum{display:flex;align-items:baseline;gap:8px;padding:9px 12px;border-top:1px solid var(--bd);background:#fafbfc}
.sum .big{font-size:clamp(23px,1.7vw,29px);font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.sum .sub{font-size:12.5px;color:var(--dim)}
.foot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--bd)}
.foot .sp{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px;color:#3d4654;cursor:pointer}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
 background:#111827;color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;
 opacity:0;pointer-events:none;transition:opacity .18s;max-width:80vw;z-index:9}
.toast.show{opacity:1}
.toast.bad{background:#991b1b} .toast.ok{background:#166534}

@media (max-width:1100px){
  .main{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="title">手工记账</div>
    <div class="seg" id="mktSeg">
      <button data-mk="MO" class="on">澳门</button>
      <button data-mk="HK">香港</button>
    </div>
    <span class="lbl">账号</span>
    <select id="acc"></select>
    <span class="lbl">挂在谁名下</span>
    <input id="who" list="whoList" placeholder="选一个，或直接打名字" style="width:170px">
    <datalist id="whoList"></datalist>
    <span class="sp"></span>
    <span class="lbl" id="yearChip"></span>
    <a href="/" class="btn" style="text-decoration:none">回看板</a>
  </div>

  <div class="main">
    <!-- 左：号码 / 生肖 / 玩法 -->
    <div>
      <div class="panel">
        <div class="ph">号码盘 <span>点号码就只算这些号</span></div>
        <div class="pad"><div class="numpad" id="numpad"></div></div>
      </div>
      <div class="panel" style="margin-top:10px">
        <div class="ph">生肖 <span>多选取并集</span></div>
        <div class="pad"><div class="zrow" id="zrow"></div></div>
      </div>
      <div class="panel" style="margin-top:10px">
        <div class="ph">玩法 <span>多选取交集；和生肖之间也取交</span></div>
        <div class="pad" id="playzone"></div>
      </div>
      <div class="panel" style="margin-top:10px">
        <div class="ph">生肖注（平特 / 连肖 / 二中二） <span>整肖的钱不进号码盘</span></div>
        <div class="pad">
          <div class="seg" id="zxMode" style="display:flex;width:fit-content">
            <button data-m="pt" class="on">平特</button>
            <button data-m="lx">连肖</button>
            <button data-m="zh2">二中二</button>
            <button data-m="zh3">三中三</button>
            <button data-m="zh4">四中四</button>
            <button data-m="zh5">五中五</button>
            <button data-m="zh6">六中六</button>
          </div>
          <div class="seg" id="zxLen" style="display:none;width:fit-content;margin-top:8px">
            <button data-l="2">2连</button>
            <button data-l="3">3连</button>
            <button data-l="4">4连</button>
            <button data-l="5">5连</button>
          </div>
          <div class="seg" id="zxSplit" style="display:flex;width:fit-content;margin-top:8px">
            <button data-s="share" class="on">共（分摊到每个肖）</button>
            <button data-s="each">各（每个肖各这么多）</button>
          </div>
          <div class="zrow" id="zxRow" style="margin-top:9px"></div>
          <div style="display:flex;align-items:center;gap:9px;margin-top:10px">
            <div class="hint" id="zxHint" style="margin:0;flex:1">点生肖；平特可多选</div>
            <button class="btn pri" id="zxAdd" disabled>加入生肖注</button>
          </div>
        </div>
      </div>
      <div class="hint" id="hint">点号码 / 生肖 / 玩法；填的金额＝每个号各多少</div>
    </div>

    <!-- 右：金额 + 清单 -->
    <div class="panel">
      <div class="ph">这一注 <span>金额＝每个号各多少</span></div>
      <div class="pad">
        <div class="amtline">
          <input id="amt" type="number" min="1" step="1" placeholder="每号多少元">
          <button class="btn pri" id="addBtn">加入</button>
        </div>
        <div class="quick">
          <button class="qb" data-a="10">10</button>
          <button class="qb" data-a="20">20</button>
          <button class="qb" data-a="50">50</button>
          <button class="qb" data-a="100">100</button>
          <button class="qb" data-a="200">200</button>
        </div>
      </div>

      <div class="ph" style="margin-top:2px">清单 <span>点一行可按 Delete 删</span></div>
      <div id="listBox">
        <div class="empty">还没有加入任何一注</div>
      </div>

      <div class="sum">
        <span class="big" id="sumBig">0</span>
        <span class="sub" id="sumSub">元 / 0 个号 / 0 注</span>
      </div>
      <div class="foot">
        <label class="chk"><input type="checkbox" id="loop" checked>连续记账</label>
        <span class="sp"></span>
        <button class="btn danger" id="clearBtn" style="color:#c0392b;border-color:#e3b3ae;background:#fdf4f3">清空</button>
        <button class="btn pri big" id="okBtn" disabled>记账</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let META = null;
let S = { nums: new Set(), z: new Set(), p: new Set() };
let NOTES = [];

/* 生肖注（平特 / 连肖 / 二中二 / 三中三）：界面先上，记账功能等规则确认后再接 */
const ZORDER = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
let ZX = { mode: "pt", split: "share", len: 2, z: new Set() };
let CUR = new Set();          // 当前条件算出来的号（由服务端返回）
let MKT = "MO";
let selRow = -1;

const $ = (id) => document.getElementById(id);
const money = (v) => Number(v || 0).toLocaleString("zh-CN",
  { minimumFractionDigits: 0, maximumFractionDigits: 2 });

function toast(msg, kind) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = "toast"; }, kind === "bad" ? 4200 : 2600);
}

async function jpost(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  try { return await r.json(); } catch (e) { return { ok: false, error: "服务返回不是 JSON" }; }
}

/* ---------- 初始化 ---------- */
async function boot() {
  const r = await fetch("/api/manual/meta");
  META = await r.json();
  if (!META || !META.ok) { toast("读不到配置：" + ((META && META.error) || "服务没起来？"), "bad"); return; }

  $("yearChip").textContent = META.zodiac_year ? (META.zodiac_year + "年 · " + META.play_count + " 个玩法") : (META.play_count + " 个玩法");

  // 账号：默认选真有账的那个，不是按名字排第一
  const acc = $("acc");
  acc.innerHTML = (META.accounts || []).map(a => `<option value="${a}">${a}</option>`).join("") || `<option value="">（没有账号）</option>`;
  if (META.default_account) acc.value = META.default_account;
  // 对象
  $("whoList").innerHTML = (META.chats || []).map(c => `<option value="${c.replace(/"/g, "&quot;")}">`).join("");

  renderNums(); renderZ(); renderPlays(); renderZx();
  poke();
}

function renderNums() {
  const cls = { "红波": "r", "蓝波": "b", "绿波": "g" };
  $("numpad").innerHTML = META.numbers.map(n =>
    `<div class="nb ${cls[n.color] || "n"}" data-num="${n.num}">${n.num}</div>`).join("");
  $("numpad").querySelectorAll(".nb").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.num;
      if (S.nums.has(k)) S.nums.delete(k); else S.nums.add(k);
      poke();
    };
  });
}

function renderZ() {
  $("zrow").innerHTML = META.zodiacs.map(z =>
    `<div class="zb" data-z="${z.label}">${z.label}</div>`).join("");
  $("zrow").querySelectorAll(".zb").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.z;
      if (S.z.has(k)) S.z.delete(k); else S.z.add(k);
      poke();
    };
  });
}

function renderPlays() {
  $("playzone").innerHTML = META.groups.map(g => `
    <div class="grp">
      <div class="gname">${g.group}</div>
      <div class="plays">${g.items.map(it =>
        `<div class="pb" data-p="${it.code}">${it.label}</div>`).join("")}</div>
    </div>`).join("");
  $("playzone").querySelectorAll(".pb").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.p;
      if (S.p.has(k)) S.p.delete(k); else S.p.add(k);
      poke();
    };
  });
}

/* ---------- 生肖注 ---------- */
function renderZx() {
  $("zxRow").innerHTML = ZORDER.map(z =>
    `<div class="zb" data-z="${z}">${z}</div>`).join("");
  $("zxRow").querySelectorAll(".zb").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.z;
      if (ZX.z.has(k)) ZX.z.delete(k); else ZX.z.add(k);
      paintZx();
    };
  });
  paintZx();
}

/* 组合注：中二要 2 个肖，中三 3 个……中六 6 个 */
const ZH_NEED = {zh2: 2, zh3: 3, zh4: 4, zh5: 5, zh6: 6};
const ZH_NAME = {zh2: "二中二", zh3: "三中三", zh4: "四中四", zh5: "五中五", zh6: "六中六"};

function zxSet() {
  const picked = ZORDER.filter(z => ZX.z.has(z));
  if (ZX.mode === "lx" && picked.length) {
    const i = ZORDER.indexOf(picked[0]);
    const n = Math.max(2, ZX.len);
    return Array.from({ length: n }, (_, k) => ZORDER[(i + k) % 12]);
  }
  return picked;
}

function zxCalc() {
  const zs = zxSet();
  const amt = Number($("amt").value || 0);
  const need = ZH_NEED[ZX.mode];
  if (need) {
    if (zs.length < need) return { zs: zs, per: null, need: need, total: 0 };
    const pick = zs.slice(0, need);
    // 组合注默认整注；点「各」就是每肖各这么多，两肖各 10 = 20
    const total = ZX.split === "each"
      ? Math.round(amt * pick.length * 100) / 100 : amt;
    return { zs: pick, per: null, need: need, total: total, eachOne: amt };
  }
  const n = zs.length;
  if (!n || !(amt > 0)) return { zs: zs, per: null, total: 0 };
  if (ZX.split === "each") {
    const per = {}; zs.forEach(z => { per[z] = amt; });
    return { zs: zs, per: per, total: Math.round(amt * n * 100) / 100 };
  }
  const each = Math.floor(amt / n * 100) / 100;
  const per = {}; zs.forEach(z => { per[z] = each; });
  per[zs[0]] = Math.round((amt - each * (n - 1)) * 100) / 100;   // 余数给第一个肖
  let t = 0; zs.forEach(z => { t += per[z]; });
  return { zs: zs, per: per, total: Math.round(t * 100) / 100 };
}

function zxName() {
  return ZH_NAME[ZX.mode] || (ZX.mode === "lx" ? ZX.len + "连肖" : "平特");
}

function paintZx() {
  $("zxRow").querySelectorAll(".zb").forEach(el =>
    el.classList.toggle("on", ZX.z.has(el.dataset.z)));
  $("zxLen").style.display = ZX.mode === "lx" ? "flex" : "none";
  $("zxLen").querySelectorAll("button").forEach(b =>
    b.classList.toggle("on", Number(b.dataset.l) === Number(ZX.len)));
  $("zxSplit").querySelectorAll("button").forEach(b =>
    b.classList.toggle("on", b.dataset.s === ZX.split));
  $("zxMode").querySelectorAll("button").forEach(b =>
    b.classList.toggle("on", b.dataset.m === ZX.mode));

  const c = zxCalc();
  const h = $("zxHint");
  const add = $("zxAdd");
  const need = c.need || 0;
  if (!c.zs.length) {
    h.className = "hint";
    h.textContent = ZH_NEED[ZX.mode]
      ? ("点 " + need + " 个生肖（" + zxName() + "）")
      : (ZX.mode === "lx"
          ? ("点一个生肖，从它往后连 " + ZX.len + " 个")
          : "点生肖；平特可多选（共＝分摊，各＝每肖各这么多）");
    add.disabled = true;
    return;
  }
  if (need && c.zs.length < need) {
    h.className = "hint warn";
    h.textContent = zxName() + " 要选 " + need + " 个肖";
    add.disabled = true;
    return;
  }
  if (!(Number($("amt").value || 0) > 0)) {
    h.className = "hint";
    h.textContent = zxName() + " " + c.zs.join("+") + " → 在右边填金额";
    add.disabled = true;
    return;
  }
  h.className = "hint ok";
  const zhongEach = !!ZH_NEED[ZX.mode] && ZX.split === "each";
  h.textContent = c.per
    ? (zxName() + " " + c.zs.join("+") + " → 每肖 " + money(c.per[c.zs[0]])
       + "，共 " + money(c.total) + " 元")
    : (zhongEach
        ? (zxName() + " " + c.zs.join("+") + " → 各 " + money(c.eachOne) + " ×"
           + c.zs.length + " 肖 = " + money(c.total) + " 元（" + c.zs.length
           + " 个肖同时命中）")
        : (zxName() + " " + c.zs.join("+") + " → 整注 " + money(c.total)
           + " 元（" + c.zs.length + " 个肖同时命中）"));
  add.disabled = false;
}

/* 生肖注写成客户会写的那句原文：服务端按同一套规则再解析一遍，不能自创语法 */
function numText(v) {
  v = Number(v || 0);
  return Number.isInteger(v) ? String(v) : v.toFixed(2);
}
function zxText(c) {
  const all = c.zs.join("");
  if (ZH_NEED[ZX.mode]) return all + ZH_NAME[ZX.mode] + numText(c.total);
  if (ZX.mode === "lx") return all + Math.max(2, c.zs.length) + "连肖" + numText(c.total);
  if (ZX.split === "each") return "平特" + all + "各" + numText(c.per[c.zs[0]]);
  return "平特" + all + numText(c.total);
}

function zxAddNote() {
  const c = zxCalc();
  if (!c.zs.length) return toast("先选生肖", "bad");
  if (c.need && c.zs.length < c.need) return toast(zxName() + " 要选 " + c.need + " 个肖", "bad");
  if (!(Number($("amt").value || 0) > 0)) return toast("先在右边填金额", "bad");
  const vals = c.per ? c.zs.map(z => c.per[z]) : [];
  const same = vals.length && vals.every(v => Math.abs(v - vals[0]) < 1e-9);
  const zhongEach = !!ZH_NEED[ZX.mode] && ZX.split === "each";
  const eachTxt = c.per
    ? (same ? "每肖 " + money(vals[0]) : "分摊 " + vals.map(v => money(v)).join("/"))
    : (zhongEach ? "各 " + money(c.eachOne) + " ×" + c.zs.length : "整注");
  NOTES.push({
    zx: true, flat: true, text: zxText(c), label: zxName() + " " + c.zs.join("+"),
    nums: [], each: (c.per ? c.per[c.zs[0]] : c.total),
    eachTxt: eachTxt, total: c.total, zodiacs: c.zs
  });
  ZX.z = new Set();
  $("amt").value = "";
  paintZx(); renderNotes();
  toast("生肖注已进清单，记账时单独落一笔（不进号码盘）", "ok");
}

/* ---------- 条件变了：问服务端算号（不在前端自己算） ---------- */
let poking = 0;
async function poke() {
  const seq = ++poking;
  const r = await jpost("/api/manual/build", {
    nums: [...S.nums], zodiacs: [...S.z], plays: [...S.p], amount: 1
  });
  if (seq !== poking) return;                    // 有更新的请求了，丢弃这次结果
  CUR = new Set(r.ok ? r.nums : []);
  paint();
  showHint(r);
}

function paint() {
  document.querySelectorAll("#numpad .nb").forEach(el => {
    el.classList.toggle("on", CUR.has(el.dataset.num));
  });
  document.querySelectorAll("#zrow .zb").forEach(el => {
    el.classList.toggle("on", S.z.has(el.dataset.z));
  });
  document.querySelectorAll("#playzone .pb").forEach(el => {
    el.classList.toggle("on", S.p.has(el.dataset.p));
  });
}

function condText() {
  const parts = [];
  if (S.nums.size) parts.push("号码 " + [...S.nums].sort().join(" "));
  else {
    if (S.z.size) {
      const order = META.zodiacs.map(z => z.label);
      parts.push(order.filter(z => S.z.has(z)).join("+"));
    }
    if (S.p.size) parts.push([...S.p].sort().join(" ∩ "));
  }
  return parts.join(" · ");
}

function showHint(r) {
  const el = $("hint");
  const add = $("addBtn");
  if (!S.nums.size && !S.z.size && !S.p.size) {
    el.className = "hint";
    el.textContent = "点号码 / 生肖 / 玩法；填的金额＝每个号各多少";
    add.disabled = false;
    return;
  }
  const cond = condText();
  if (!r || !r.ok || !CUR.size) {
    el.className = "hint warn";
    el.textContent = "条件：" + cond + " → 没有共同的号，换个选法";
    add.disabled = true;
    return;
  }
  const amt = Number($("amt").value || 0);
  const tail = amt > 0
    ? ("每号 " + money(amt) + " · 合计 " + money(amt * CUR.size) + " 元")
    : "每号 —";
  el.className = "hint ok";
  el.textContent = "条件：" + cond + " → " + CUR.size + " 个号 · " + tail;
  add.disabled = false;
}

/* ---------- 加入清单 ---------- */
async function addNote() {
  if (!S.nums.size && !S.z.size && !S.p.size) return toast("先选号码、生肖或玩法", "bad");
  const amt = Number($("amt").value || 0);
  if (!(amt > 0)) return toast("金额写个数字，比如 50", "bad");
  const r = await jpost("/api/manual/build", {
    nums: [...S.nums], zodiacs: [...S.z], plays: [...S.p], amount: amt
  });
  if (!r.ok) return toast(r.reason || "这组条件加不进去", "bad");
  NOTES.push({ text: r.text, label: r.label, nums: r.nums, each: r.each, total: r.total });
  S = { nums: new Set(), z: new Set(), p: new Set() };
  CUR = new Set();
  $("amt").value = "";
  paint(); showHint(null); renderNotes();
  $("amt").focus();
}

function renderNotes() {
  const box = $("listBox");
  if (!NOTES.length) {
    box.innerHTML = '<div class="empty">还没有加入任何一注</div>';
    selRow = -1;
  } else {
    box.innerHTML = `<table><thead><tr>
      <th style="width:34px">#</th><th>内容</th><th class="tr" style="width:110px">每号 / 每肖</th>
      <th class="tr" style="width:86px">合计</th><th style="width:26px"></th></tr></thead><tbody>
      ${NOTES.map((n, i) => `<tr data-i="${i}" class="${i === selRow ? "sel" : ""}">
        <td class="n">${i + 1}</td>
        <td class="item">${n.label}${n.zx ? ' <span class="mini">生肖注</span>' : ""}</td>
        <td class="n">${n.eachTxt || money(n.each)}</td>
        <td class="n"><b>${money(n.total)}</b></td>
        <td><span class="row-x" data-x="${i}">×</span></td></tr>`).join("")}
      </tbody></table>`;
    box.querySelectorAll("tbody tr").forEach(tr => {
      tr.onclick = (e) => {
        if (e.target.classList.contains("row-x")) return;
        selRow = Number(tr.dataset.i); renderNotes();
      };
    });
    box.querySelectorAll(".row-x").forEach(x => {
      x.onclick = (e) => {
        e.stopPropagation();
        const i = Number(x.dataset.x);
        NOTES.splice(i, 1);
        if (selRow >= NOTES.length) selRow = NOTES.length - 1;
        renderNotes();
      };
    });
  }
  const total = NOTES.reduce((a, n) => a + n.total, 0);
  const cnt = NOTES.reduce((a, n) => a + n.nums.length, 0);
  const zxn = NOTES.filter(n => n.zx).length;
  $("sumBig").textContent = money(total);
  $("sumSub").textContent = "元 / " + cnt + " 个号 / " + NOTES.length + " 注"
    + (zxn ? "（含生肖注 " + zxn + " 注）" : "");
  $("okBtn").disabled = !NOTES.length || !($("who").value || "").trim();
}

/* ---------- 记账 ---------- */
async function submit() {
  if (!NOTES.length) return toast("清单是空的", "bad");
  const chat = ($("who").value || "").trim();
  if (!chat) { toast("填一下挂在谁名下", "bad"); $("who").focus(); return; }
  const total = NOTES.reduce((a, n) => a + n.total, 0);
  const cnt = NOTES.reduce((a, n) => a + n.nums.length, 0);
  if (total > (META.limit_confirm || 1000)
      && !confirm("这次要记 " + money(total) + " 元（" + NOTES.length + " 注，" + cnt + " 个号），确认记吗？")) return;

  const btn = $("okBtn");
  btn.disabled = true; btn.textContent = "记账中…";
  const r = await jpost("/api/manual/submit", {
    notes: NOTES.map(n => ({ text: n.text, each: n.each, nums: n.nums,
                             flat: !!n.flat })),
    chat: chat, account: $("acc").value || "", market: MKT
  });
  btn.textContent = "记账";
  if (!r.ok) {
    toast("没记上：" + (r.error || "未知原因") + "（清单还在，改完再点一次）", "bad");
    btn.disabled = false;
    return;
  }
  let msg = "已记账（" + (r.market_name || "") + "）：" + (r.notes || 0) + " 注 · "
    + (r.numbers || 0) + " 个号 · 合计 " + money(r.total) + " 元";
  if (r.archived_issue) msg += "；已换期，上一期 " + r.archived_issue + " 归档";
  toast(msg, "ok");
  NOTES = []; selRow = -1; renderNotes();
  if (!$("loop").checked) $("who").value = "";
  $("amt").focus();
}

/* ---------- 事件 ---------- */
$("mktSeg").querySelectorAll("button").forEach(b => {
  b.onclick = () => {
    MKT = b.dataset.mk;
    $("mktSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  };
});
$("addBtn").onclick = addNote;
$("zxAdd").onclick = zxAddNote;
$("zxMode").querySelectorAll("button").forEach(b => {
  b.onclick = () => { ZX.mode = b.dataset.m; paintZx(); };
});
$("zxLen").querySelectorAll("button").forEach(b => {
  b.onclick = () => { ZX.len = Number(b.dataset.l); paintZx(); };
});
$("zxSplit").querySelectorAll("button").forEach(b => {
  b.onclick = () => { ZX.split = b.dataset.s; paintZx(); };
});
$("okBtn").onclick = submit;
$("clearBtn").onclick = () => {
  if (!NOTES.length) return;
  if (!confirm("清空清单？")) return;
  NOTES = []; selRow = -1; renderNotes();
};
document.querySelectorAll(".qb").forEach(b => {
  b.onclick = () => { $("amt").value = b.dataset.a; showHint({ ok: CUR.size > 0 }); $("amt").focus(); };
});
$("amt").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addNote(); } });
$("amt").addEventListener("input", () => { showHint({ ok: CUR.size > 0 }); paintZx(); });
$("who").addEventListener("input", () => { $("okBtn").disabled = !NOTES.length || !($("who").value || "").trim(); });
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); submit(); }
  if (e.key === "Delete" && selRow >= 0 && NOTES[selRow]) {
    NOTES.splice(selRow, 1); selRow = Math.min(selRow, NOTES.length - 1); renderNotes();
  }
});

boot();
</script>
</body>
</html>
